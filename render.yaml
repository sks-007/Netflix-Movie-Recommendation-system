services:
  - type: web
    name: netflix-recommendation
    env: python
    pythonVersion: 3.11
    buildCommand: |
      pip install --upgrade pip
      pip install --no-cache-dir -r requirements.txt
      chmod +x start.sh
      python test_model.py
    startCommand: ./start.sh
    plan: starter  # Use paid plan for better resources (1GB RAM, 0.5 CPU)
    envVars:
      - key: PYTHONUNBUFFERED
        value: true
      - key: FLASK_ENV
        value: production
      - key: GUNICORN_TIMEOUT
        value: 180
      - key: MODEL_LOAD_TIMEOUT
        value: 60
      - key: WEB_CONCURRENCY
        value: 1

